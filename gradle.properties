org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 8.7.2 was tested up to compileSdk 35; suppress the warning for compileSdk 36
# (Android 16) which Google Play requires apps to target. No API-36-specific
# resources are used, so the older build tools compile against it fine.
android.suppressUnsupportedCompileSdk=36
